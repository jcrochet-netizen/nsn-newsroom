name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,27,47 * * * *'   # toutes les 20 min, hors heures rondes (créneaux surchargés chez GitHub, souvent retardés)
  workflow_dispatch:          # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # cache des pages d'articles déjà lues (nombre de mots / image), conservé d'un passage à l'autre
      - uses: actions/cache@v4
        with:
          path: cache.json
          key: page-cache-${{ github.run_id }}
          restore-keys: page-cache-

      - run: node build.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
